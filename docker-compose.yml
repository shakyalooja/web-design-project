services:
  web:
    build: .
    environment:
      DB_HOST: db
      DB_USER: tripplanner
      DB_PASS: tripplanner_pw
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www/html
      - ./backend:/var/www/html/backend
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "trip_planner"
      MYSQL_USER: tripplanner
      MYSQL_PASSWORD: tripplanner_pw
    volumes:
      - ./database/trip_planner.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped

volumes:
  db_data:
