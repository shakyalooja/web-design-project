<!DOCTYPE html>
<html>
<head>
    <title>My Trips</title>
</head>
<body>

    <h1>My Trips</h1>

    <button id="newTripBtn">+ New Trip</button>

    <hr>

    <!-- This is where the list of trips will go later -->
    <div id="tripList">
        <p>Trip cards will appear here.</p>
    </div>

    <!-- A simple hidden-for-now form to create a trip -->
    <h2>Add a Trip</h2>
    <form id="tripForm">
        <label>Trip Name:</label>
        <input type="text" name="trip_name" id="tripName">
        <br><br>

        <label>Start Date:</label>
        <input type="date" name="start_date" id="startDate">
        <br><br>

        <label>End Date:</label>
        <input type="date" name="end_date" id="endDate">
        <br><br>

        <button type="submit">Save Trip</button>
    </form>

</body>
</html>
