<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Destinations, activities, costs and sharing for one trip.">
    <title>Trip Detail - TripPlanner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <a href="dashboard.html" class="brand">TripPlanner</a>
        <nav aria-label="Main">
            <a href="dashboard.html" class="btn-link">Back to Dashboard</a>
            <button id="logoutBtn" class="btn-secondary">Logout</button>
        </nav>
    </header>

    <main id="main" class="page-container">
        <h1 id="tripNameHeading">Trip Name Here</h1>
        <p id="tripDates" class="muted"></p>

        <p class="total-cost">Total Estimated Cost: <strong id="totalCost">$0.00</strong></p>
        <p id="budgetLine" aria-live="polite"></p>

        <div class="actions">
            <button id="editTripBtn" class="btn-secondary">Edit Trip</button>
            <button id="shareTripBtn" class="btn-secondary">Share Trip</button>
            <button id="deleteTripBtn" class="btn-danger">Delete Trip</button>
        </div>
        <p id="message" role="status" aria-live="polite"></p>

        <section class="card" aria-labelledby="breakdownHeading">
            <h2 id="breakdownHeading">Cost breakdown</h2>
            <ul id="breakdownList" class="breakdown-list"></ul>
        </section>

        <h2>Destinations</h2>
        <div id="destinationList">
            <p>Destinations will appear here.</p>
        </div>

        <h2>Add a Destination</h2>
        <form id="destinationForm">
            <label for="locationName">Location Name:</label>
            <input type="text" name="location_name" id="locationName" required maxlength="150">

            <label for="arrivalDate">Arrival Date:</label>
            <input type="date" name="arrival_date" id="arrivalDate">

            <label for="departureDate">Departure Date:</label>
            <input type="date" name="departure_date" id="departureDate">

            <label for="notes">Notes:</label>
            <textarea name="notes" id="notes" maxlength="2000"></textarea>

            <button type="submit">Add Destination</button>
        </form>

        <h2>Activities</h2>
        <div id="activityList">
            <p>Activities will appear here.</p>
        </div>

        <h2>Add an Activity</h2>
        <form id="activityForm">
            <label for="activityDestination">Destination:</label>
            <select name="destination_id" id="activityDestination"></select>

            <label for="activityName">Activity Name:</label>
            <input type="text" name="activity_name" id="activityName" required maxlength="150">

            <label for="category">Category:</label>
            <select name="category" id="category"></select>

            <label for="estimatedCost">Estimated Cost ($):</label>
            <input type="number" name="estimated_cost" id="estimatedCost" step="0.01" min="0" value="0">

            <button type="submit">Add Activity</button>
        </form>
    </main>

    <script src="js/common.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
